<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>AI Loan Approval System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow-lg">

            <div class="card-header text-center">

                <h2>AI Loan Approval System</h2>

            </div>

            <div class="card-body">

                <form action="/predict" method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Gender</label>
                            <select class="form-control" name="Gender">
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Married</label>
                            <select class="form-control" name="Married">
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Dependents</label>
                            <select class="form-control" name="Dependents">
                                <option>0</option>
                                <option>1</option>
                                <option>2</option>
                                <option>3+</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Education</label>
                            <select class="form-control" name="Education">
                                <option>Graduate</option>
                                <option>Not Graduate</option>
                            </select>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Self Employed</label>
                            <select class="form-control" name="Self_Employed">
                                <option>No</option>
                                <option>Yes</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Property Area</label>
                            <select class="form-control" name="Property_Area">
                                <option>Urban</option>
                                <option>Semiurban</option>
                                <option>Rural</option>
                            </select>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Applicant Income</label>
                            <input class="form-control" type="number" name="ApplicantIncome" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Coapplicant Income</label>
                            <input class="form-control" type="number" name="CoapplicantIncome" required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Loan Amount</label>
                            <input class="form-control" type="number" name="LoanAmount" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Loan Amount Term</label>
                            <input class="form-control" type="number" name="Loan_Amount_Term" required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-12 mb-3">
                            <label>Credit History</label>
                            <select class="form-control" name="Credit_History">
                                <option value="1">Good Credit History</option>
                                <option value="0">Bad Credit History</option>
                            </select>
                        </div>

                    </div>

                    <button class="btn btn-primary w-100">
                        Predict Loan Approval
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
