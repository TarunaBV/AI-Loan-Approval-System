<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>AI Loan Approval System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow-lg">

            <div class="card-header text-center">

                <h2>🏦 AI Loan Approval System</h2>

            </div>

            <div class="card-body">

                <form action="/predict" method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Gender</label>

                            <select class="form-control" name="Gender">
                                <option>Male</option>
                                <option>Female</option>
                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Married</label>

                            <select class="form-control" name="Married">
                                <option>Yes</option>
                                <option>No</option>
                            </select>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label>Applicant Income</label>
                            <input class="form-control" type="number" name="ApplicantIncome" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label>Coapplicant Income</label>
                            <input class="form-control" type="number" name="CoapplicantIncome" required>
                        </div>

                    </div>

                    <button class="btn btn-primary w-100">
                        Predict Loan Approval
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
